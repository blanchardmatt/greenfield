<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Cutscene Renderer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Pixel Cutscene Renderer</h1>
  <div id="canvas-wrapper">
    <canvas id="display-canvas" width="768" height="672"></canvas>
  </div>
  <div id="controls">
    <label>Load script:</label>
    <input type="file" id="script-file" accept=".json">
    <button id="btn-demo">Play Demo</button>
    <button id="btn-restart">Restart</button>
  </div>
  <div id="hint">SPACE / Click to advance dialogue &bull; ESC to skip action</div>

  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/script-parser.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/player-init.js"></script>
</body>
</html>
