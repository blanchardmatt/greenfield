<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Cutscene Renderer</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0f;
  color: #c0c0c0;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  font-size: 18px;
  color: #8888cc;
  margin-bottom: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

#canvas-wrapper {
  position: relative;
  border: 3px solid #333;
  box-shadow: 0 0 20px rgba(80, 80, 160, 0.3);
  background: #000;
  cursor: pointer;
}

#display-canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#controls {
  margin-top: 16px;
  display: flex;
  gap: 12px;
  align-items: center;
}

#controls label {
  font-size: 13px;
  color: #888;
}

#script-file {
  font-family: monospace;
  font-size: 13px;
  background: #1a1a2e;
  color: #c0c0c0;
  border: 1px solid #333;
  padding: 6px 10px;
  cursor: pointer;
}

#script-file::file-selector-button {
  font-family: monospace;
  font-size: 12px;
  background: #2a2a4e;
  color: #aaa;
  border: 1px solid #444;
  padding: 4px 10px;
  cursor: pointer;
  margin-right: 8px;
}

#script-file::file-selector-button:hover {
  background: #3a3a5e;
}

button {
  font-family: monospace;
  font-size: 13px;
  background: #2a2a4e;
  color: #aaa;
  border: 1px solid #444;
  padding: 6px 14px;
  cursor: pointer;
}

button:hover {
  background: #3a3a5e;
  color: #ccc;
}

#hint {
  margin-top: 10px;
  font-size: 11px;
  color: #555;
}

#display-canvas {
  width: 100%;
  height: auto;
}
#canvas-wrapper {
  max-width: 100%;
  width: 768px;
}
</style>
</head>
<body>
<h1>Pixel Cutscene Renderer</h1>
<div id="canvas-wrapper">
<canvas id="display-canvas" width="768" height="672"></canvas>
</div>
<div id="controls">
<button id="btn-load">Load Script</button>
<input type="file" id="script-file" accept=".json,text/plain" style="display:none">
<button id="btn-demo">Demo</button>
<button id="btn-serenade">Serenade</button>
<button id="btn-shards">Shards</button>
<button id="btn-restart">Restart</button>
<div class="toolbar-sep" style="width:1px;height:20px;background:#333;margin:0 4px;display:inline-block"></div>
<button id="btn-prev">Prev</button>
<button id="btn-next">Next</button>
<div class="toolbar-sep" style="width:1px;height:20px;background:#333;margin:0 4px;display:inline-block"></div>
<button id="btn-record" style="background:#553333;border-color:#774444">Record</button>
<button id="btn-export-vid" style="background:#333355;border-color:#444477">Export Video</button>
</div>
<div id="record-status" style="font-size:11px;color:#cc5555;margin-top:4px;display:none">Recording...</div>
<div id="hint">Tap / Space to advance dialogue</div>

/**

const PixelFont = (() => {

    125:[0x08,0x04,0x04,0x02,0x04,0x04,0x08], // }
    126:[0x00,0x00,0x08,0x15,0x02,0x00,0x00], // ~
  };

  const CHAR_W = 5;
  const CHAR_H = 7;

  function drawChar(ctx, code, x, y, color, scale) {
    const glyph = glyphs[code];
    if (!glyph) return;
    ctx.fillStyle = color;
    for (let row = 0; row < CHAR_H; row++) {
      for (let col = 0; col < CHAR_W; col++) {
        if (glyph[row] & (1 << (CHAR_W - 1 - col))) {
          ctx.fillRect(
            x + col * scale,
            y + row * scale,
            scale,
            scale
          );
        }
      }
    }
  }

  function drawText(ctx, text, x, y, color, scale = 1) {
    const spacing = (CHAR_W + 1) * scale;
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      drawChar(ctx, code, x + i * spacing, y, color, scale);
    }
  }

  function measureText(text, scale = 1) {
    const spacing = (CHAR_W + 1) * scale;
    return {
      width: text.length * spacing - scale,
      height: CHAR_H * scale,
    };
  }

  function wrapText(text, maxWidth, scale = 1) {
    const spacing = (CHAR_W + 1) * scale;
    const maxChars = Math.floor((maxWidth + scale) / spacing);
    const words = text.split(' ');
    const lines = [];
    let current = '';

    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (test.length > maxChars && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  return { drawText, measureText, wrapText, CHAR_W, CHAR_H };
})();

  };

    return rows.map(row => {
      const out = [];
      for (let i = 0; i < row.length; i++) {

/**
 * AnimationSystem — Manages tweens, screen effects, and typewriter text.
 */
const AnimationSystem = (() => {
  const activeTweens = [];

  // Camera state for shake effect
  const camera = { offsetX: 0, offsetY: 0 };
  let shakeIntensity = 0;
  let shakeDuration = 0;
  let shakeElapsed = 0;

  // Fade overlay
  let fadeAlpha = 1.0; // start black
  let fadeTween = null;

  // Typewriter state
  const typewriter = {
    text: '',
    revealedCount: 0,
    speed: 30, // ms per character
    elapsed: 0,
    done: true,
    lines: [],
    maxWidth: 0,
    scale: 1,
  };

  function addTween(target, property, from, to, duration, easing = 'linear') {
    const tween = { target, property, from, to, duration, elapsed: 0, easing, done: false };
    target[property] = from;
    activeTweens.push(tween);
    return tween;
  }

  function ease(t, type) {
    switch (type) {
      case 'easeIn': return t * t;
      case 'easeOut': return 1 - (1 - t) * (1 - t);
      case 'easeInOut': return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      default: return t; // linear
    }
  }

  function update(dt) {
    // Update tweens
    for (let i = activeTweens.length - 1; i >= 0; i--) {
      const tw = activeTweens[i];
      tw.elapsed += dt;
      const progress = Math.min(tw.elapsed / tw.duration, 1);
      const t = ease(progress, tw.easing);
      tw.target[tw.property] = tw.from + (tw.to - tw.from) * t;
      if (progress >= 1) {
        tw.done = true;
        activeTweens.splice(i, 1);
      }
    }

    // Update shake
    if (shakeElapsed < shakeDuration) {
      shakeElapsed += dt;
      const remaining = 1 - shakeElapsed / shakeDuration;
      camera.offsetX = (Math.random() * 2 - 1) * shakeIntensity * remaining;
      camera.offsetY = (Math.random() * 2 - 1) * shakeIntensity * remaining;
    } else {
      camera.offsetX = 0;
      camera.offsetY = 0;
    }

    // Update fade tween
    if (fadeTween && !fadeTween.done) {
      // handled by tween system via fadeState
    }

    // Update typewriter
    if (!typewriter.done) {
      typewriter.elapsed += dt;
      const charsToReveal = Math.floor(typewriter.elapsed / typewriter.speed);
      typewriter.revealedCount = Math.min(charsToReveal, typewriter.text.length);
      if (typewriter.revealedCount >= typewriter.text.length) {
        typewriter.done = true;
      }
    }
  }

  // Fade state object that tween system can target
  const fadeState = { alpha: 1.0 };

  function startFade(fromAlpha, toAlpha, duration) {
    fadeState.alpha = fromAlpha;
    fadeTween = addTween(fadeState, 'alpha', fromAlpha, toAlpha, duration, 'easeInOut');
    return fadeTween;
  }

  function getFadeAlpha() {
    return fadeState.alpha;
  }

  function startShake(intensity, duration) {
    shakeIntensity = intensity;
    shakeDuration = duration;
    shakeElapsed = 0;
  }

  function isShaking() {
    return shakeElapsed < shakeDuration;
  }

  function startTypewriter(text, speed, maxWidth, scale) {
    typewriter.text = text;
    typewriter.revealedCount = 0;
    typewriter.speed = speed;
    typewriter.elapsed = 0;
    typewriter.done = false;
    typewriter.maxWidth = maxWidth;
    typewriter.scale = scale;
    typewriter.lines = PixelFont.wrapText(text, maxWidth, scale);
  }

  function completeTypewriter() {
    typewriter.revealedCount = typewriter.text.length;
    typewriter.done = true;
  }

  function getTypewriterState() {
    return {
      lines: typewriter.lines,
      revealedCount: typewriter.revealedCount,
      done: typewriter.done,
      text: typewriter.text,
      scale: typewriter.scale,
    };
  }

  function getCamera() {
    return camera;
  }

  function isTweenActive(tween) {
    return tween && !tween.done;
  }

  function clear() {
    activeTweens.length = 0;
    camera.offsetX = 0;
    camera.offsetY = 0;
    shakeElapsed = shakeDuration;
    fadeState.alpha = 0;
    fadeTween = null;
    typewriter.done = true;
  }

  return {
    addTween, update, startFade, getFadeAlpha, startShake, isShaking,
    startTypewriter, completeTypewriter, getTypewriterState,
    getCamera, isTweenActive, clear,
  };
})();

      ctx.fillStyle = '#222222';
      ctx.globalAlpha = 0.9;
      // Body
      ctx.fillRect(Math.floor(birdX), Math.floor(birdY), 3, 1);
      // Wings
      if (wingUp) {
        ctx.fillRect(Math.floor(birdX) - 2, Math.floor(birdY) - 1, 2, 1);
        ctx.fillRect(Math.floor(birdX) + 3, Math.floor(birdY) - 1, 2, 1);
      } else {
        ctx.fillRect(Math.floor(birdX) - 2, Math.floor(birdY) + 1, 2, 1);
        ctx.fillRect(Math.floor(birdX) + 3, Math.floor(birdY) + 1, 2, 1);
      }
      ctx.globalAlpha = 1;
    },

    night_sky(ctx, t) {
      // Twinkling stars
      let seed = 12345;
      for (let i = 0; i < 60; i++) {
        seed = (seed * 16807) % 2147483647;
        const sx = seed % INTERNAL_W;
        seed = (seed * 16807) % 2147483647;
        const sy = seed % (INTERNAL_H - 60);
        const twinkle = 0.3 + Math.sin(t / 400 + i * 1.3) * 0.3 + Math.sin(t / 700 + i * 0.7) * 0.2;
        ctx.globalAlpha = Math.max(0.05, twinkle);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx, sy, 1, 1);
      }
      // Cloud drifting across moon area
      const cloudX = 150 + Math.sin(t / 8000) * 50;
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#334455';
      fillCircle(ctx, Math.floor(cloudX), 28, 8);
      fillCircle(ctx, Math.floor(cloudX) + 10, 25, 10);
      fillCircle(ctx, Math.floor(cloudX) + 20, 28, 7);
      // Second cloud, slower
      const cloud2X = 60 + Math.sin(t / 12000 + 2) * 70;
      ctx.globalAlpha = 0.15;
      fillCircle(ctx, Math.floor(cloud2X), 45, 12);
      fillCircle(ctx, Math.floor(cloud2X) + 14, 42, 9);
      fillCircle(ctx, Math.floor(cloud2X) + 25, 46, 8);
      // Shooting star (occasional)
      const shootCycle = 7000;
      const shootPhase = (t % shootCycle) / shootCycle;
      if (shootPhase < 0.08) {
        const sp = shootPhase / 0.08;
        const sx = 30 + sp * 100;
        const sy = 10 + sp * 40;
        ctx.globalAlpha = 1 - sp;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 1);
        ctx.fillRect(Math.floor(sx) - 2, Math.floor(sy) - 1, 1, 1);
      }
      ctx.globalAlpha = 1;
    },

    dark_tower(ctx, t) {
      // Lightning flash (rare)
      const flashCycle = 9000;
      const flashPhase = (t % flashCycle) / flashCycle;
      if (flashPhase > 0.92 && flashPhase < 0.94) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#8866cc';
        ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
      }
      // Swirling embers around tower
      ctx.fillStyle = '#884488';
      for (let i = 0; i < 10; i++) {
        const angle = (t / 2000 + i * 0.628) % (Math.PI * 2);
        const radius = 30 + Math.sin(t / 1500 + i) * 10;
        const ex = 128 + Math.cos(angle) * radius;
        const ey = 80 + Math.sin(angle) * radius * 0.5;
        ctx.globalAlpha = 0.4 + Math.sin(t / 300 + i * 2) * 0.3;
        ctx.fillRect(Math.floor(ex), Math.floor(ey), 1, 1);
      }
      // Window flicker
      const wFlicker = 0.7 + Math.sin(t / 200) * 0.2 + Math.sin(t / 370) * 0.1;
      ctx.globalAlpha = wFlicker;
      ctx.fillStyle = '#aa66aa';
      ctx.fillRect(124, 62, 8, 12);
      ctx.globalAlpha = 1;
    },

    village(ctx, t) {
      // Chimney smoke from houses
      const smokePositions = [50, 150, 220];
      ctx.fillStyle = '#999999';
      for (const sx of smokePositions) {
        for (let i = 0; i < 4; i++) {
          const age = ((t / 30 + i * 15 + sx) % 60);
          const py = 78 - age;
          const px = sx + Math.sin(t / 600 + i + sx * 0.1) * (3 + age * 0.1);
          ctx.globalAlpha = Math.max(0, 0.3 - age * 0.005);
          const size = 1 + Math.floor(age / 20);
          ctx.fillRect(Math.floor(px), Math.floor(py), size, size);
        }
      }
      // Bird sitting on roof, occasionally flaps
      const flapPhase = (t % 5000) / 5000;
      const bx = 68;
      const by = 83;
      ctx.fillStyle = '#333333';
      ctx.globalAlpha = 0.9;
      ctx.fillRect(bx, by, 3, 2);
      if (flapPhase > 0.9) {
        ctx.fillRect(bx - 2, by - 1, 2, 1);
        ctx.fillRect(bx + 3, by - 1, 2, 1);
      }
      // Clouds drifting
      const cX = ((t * 0.008) % (INTERNAL_W + 60)) - 30;
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#aabbcc';
      fillCircle(ctx, Math.floor(cX), 35, 10);
      fillCircle(ctx, Math.floor(cX) + 12, 32, 13);
      fillCircle(ctx, Math.floor(cX) + 25, 36, 9);
      ctx.globalAlpha = 1;
    },

    biltroy(ctx, t) {
      // Bonfire — animated flames
      const fireX = 145;
      const fireY = 140;
      // Flickering flames
      for (let i = 0; i < 6; i++) {
        const fx = fireX - 3 + Math.sin(t / 100 + i * 1.5) * 3;
        const fy = fireY - 4 - i * 2 + Math.sin(t / 150 + i * 2) * 2;
        const colors = ['#ff4411', '#ff6622', '#ff8833', '#ffaa44', '#ffcc55', '#ffee88'];
        ctx.fillStyle = colors[i];
        ctx.globalAlpha = 0.8 - i * 0.08;
        const w = 6 - i * 0.5;
        ctx.fillRect(Math.floor(fx), Math.floor(fy), Math.ceil(w), 3);
      }
      // Sparks rising
      ctx.fillStyle = '#ffcc44';
      for (let i = 0; i < 5; i++) {
        const age = ((t / 20 + i * 25) % 80);
        const sx = fireX + Math.sin(t / 300 + i * 3) * (4 + age * 0.1);
        const sy = fireY - 8 - age;
        ctx.globalAlpha = Math.max(0, 0.7 - age * 0.01);
        ctx.fillRect(Math.floor(sx), Math.floor(sy), 1, 1);
      }
      // Fire glow on ground
      ctx.globalAlpha = 0.1 + Math.sin(t / 200) * 0.05;
      ctx.fillStyle = '#ff6633';
      fillCircle(ctx, fireX, fireY + 4, 14);
      ctx.globalAlpha = 1;

      // Rustling leaves on oak trees
      ctx.fillStyle = '#448833';
      for (let i = 0; i < 8; i++) {
        const seed = i * 37;
        const lx = (i < 4 ? 15 : 205) + Math.sin(t / 600 + seed) * 6;
        const ly = (i < 4 ? 40 : 55) + Math.sin(t / 800 + seed * 1.3) * 4 + (i % 4) * 8;
        ctx.globalAlpha = 0.5 + Math.sin(t / 500 + seed) * 0.2;
        ctx.fillRect(Math.floor(lx), Math.floor(ly), 2, 1);
      }
      // Falling leaf
      const leafCycle = 6000;
      const leafPhase = (t % leafCycle) / leafCycle;
      const leafX = 35 + leafPhase * 30 + Math.sin(leafPhase * 12) * 8;
      const leafY = 50 + leafPhase * 90;
      if (leafY < 140) {
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#88aa33';
        ctx.fillRect(Math.floor(leafX), Math.floor(leafY), 2, 1);
      }
      // Bird flying past
      const birdCycle = 10000;
      const birdX = ((t % birdCycle) / birdCycle) * (INTERNAL_W + 40) - 20;
      const birdY = 18 + Math.sin(t / 250) * 2;
      const wingUp = Math.sin(t / 100) > 0;
      ctx.fillStyle = '#333333';
      ctx.globalAlpha = 0.8;
      ctx.fillRect(Math.floor(birdX), Math.floor(birdY), 3, 1);
      if (wingUp) {
        ctx.fillRect(Math.floor(birdX) - 2, Math.floor(birdY) - 1, 2, 1);
        ctx.fillRect(Math.floor(birdX) + 3, Math.floor(birdY) - 1, 2, 1);
      } else {
        ctx.fillRect(Math.floor(birdX) - 2, Math.floor(birdY) + 1, 2, 1);
        ctx.fillRect(Math.floor(birdX) + 3, Math.floor(birdY) + 1, 2, 1);
      }
      // Grass swaying
      ctx.fillStyle = '#6aaa4a';
      for (let i = 0; i < 6; i++) {
        const gx = 10 + i * 45;
        const sway = Math.sin(t / 700 + i * 2) * 2;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(Math.floor(gx + sway), 133, 1, 3);
        ctx.fillRect(Math.floor(gx + sway + 2), 132, 1, 4);
      }
      ctx.globalAlpha = 1;
    },
  };

  // --- Prop rendering ---

  function drawProp(propName, x, y) {
    SpriteLibrary.drawProp(ctx, propName, x, y);
  }

  // --- Character rendering ---

  function drawCharacter(char, animFrame) {
    if (!char.visible) return;
    SpriteLibrary.drawSprite(ctx, char.sprite, Math.round(char.x), Math.round(char.y), animFrame);
  }

  function drawCharacterWithOffset(char, animFrame, ox, oy) {
    if (!char.visible) return;
    const scale = char.renderScale || 1;
    if (scale === 1) {
      SpriteLibrary.drawSprite(ctx, char.sprite, Math.round(char.x + ox), Math.round(char.y + oy), animFrame);
    } else {
      // Draw scaled: render to temp canvas then scale up
      const sw = SpriteLibrary.W;
      const sh = SpriteLibrary.H;
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = sw;
      tmpCanvas.height = sh;
      const tmpCtx = tmpCanvas.getContext('2d');
      SpriteLibrary.drawSprite(tmpCtx, char.sprite, 0, 0, animFrame);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmpCanvas,
        Math.round(char.x + ox), Math.round(char.y + oy),
        Math.round(sw * scale), Math.round(sh * scale));
    }
  }

  // Draw floating music notes around a position
  function drawMusicNotes(x, y, time) {
    ctx.fillStyle = '#ddcc44';
    for (let i = 0; i < 5; i++) {
      const angle = (time / 1200 + i * 1.256) % (Math.PI * 2);
      const r = 20 + Math.sin(time / 800 + i) * 5;
      const nx = x + Math.cos(angle) * r;
      const ny = y - 10 + Math.sin(angle) * r * 0.4 - Math.sin(time / 400 + i * 2) * 3;
      ctx.globalAlpha = 0.6 + Math.sin(time / 300 + i * 1.5) * 0.3;
      // Note head
      ctx.fillRect(Math.floor(nx), Math.floor(ny), 2, 2);
      // Note stem
      ctx.fillRect(Math.floor(nx) + 2, Math.floor(ny) - 3, 1, 4);
      // Note flag
      ctx.fillRect(Math.floor(nx) + 2, Math.floor(ny) - 3, 2, 1);
    }
    ctx.globalAlpha = 1;
  }

  // --- Emote rendering ---

  function drawEmoteBubble(char, emoteName, bobOffset) {
    const ex = Math.round(char.x) + SpriteLibrary.W / 2 - 6;
    const ey = Math.round(char.y) - 16 + bobOffset;
    SpriteLibrary.drawEmote(ctx, emoteName, ex, ey);
  }

  // --- Dialogue box ---

  function drawDialogueBox(characterName, nameColor) {
    const x = DIALOG_MARGIN;
    const y = DIALOG_Y;
    const w = INTERNAL_W - DIALOG_MARGIN * 2;
    const h = DIALOG_HEIGHT;

    // Box background
    ctx.fillStyle = 'rgba(0, 0, 20, 0.85)';
    ctx.fillRect(x, y, w, h);

    // Border
    ctx.strokeStyle = '#6666aa';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    // Inner border
    ctx.strokeStyle = '#333366';
    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);

    // Character name
    if (characterName) {
      PixelFont.drawText(ctx, characterName, x + TEXT_PADDING, y + TEXT_PADDING, nameColor || '#ffffff', TEXT_SCALE);
    }
  }

  function drawDialogueText(twState, nameColor) {
    const x = DIALOG_MARGIN + TEXT_PADDING;
    const startY = DIALOG_Y + TEXT_PADDING + (PixelFont.CHAR_H + 3) * TEXT_SCALE; // below name
    const lineHeight = (PixelFont.CHAR_H + 2) * TEXT_SCALE;

    let charsRemaining = twState.revealedCount;
    for (let i = 0; i < twState.lines.length; i++) {
      const line = twState.lines[i];
      const showChars = Math.min(charsRemaining, line.length);
      if (showChars > 0) {
        PixelFont.drawText(ctx, line.substring(0, showChars), x, startY + i * lineHeight, '#ffffff', TEXT_SCALE);
      }
      charsRemaining -= line.length;
      if (charsRemaining <= 0) break;
    }

    // Blinking advance indicator when done
    if (twState.done) {
      const blinkOn = Math.floor(Date.now() / 400) % 2 === 0;
      if (blinkOn) {
        const indicatorX = INTERNAL_W - DIALOG_MARGIN - TEXT_PADDING - 6;
        const indicatorY = DIALOG_Y + DIALOG_HEIGHT - TEXT_PADDING - 4;
        ctx.fillStyle = '#8888cc';
        // Small down arrow
        ctx.fillRect(indicatorX + 1, indicatorY, 3, 1);
        ctx.fillRect(indicatorX + 2, indicatorY + 1, 1, 1);
      }
    }
  }

  // --- Transition overlay ---

  function drawFadeOverlay(alpha) {
    if (alpha <= 0) return;
    ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(alpha, 1)})`;
    ctx.fillRect(0, 0, INTERNAL_W, INTERNAL_H);
  }

  // --- Title overlay ---

  function drawTitleOverlay(state) {
    const { text, subtitle, color, subtitleColor, duration, fadeIn, fadeOut, elapsed } = state;

    // Calculate alpha for fade in/out
    let alpha = 1;
    if (elapsed < fadeIn) {
      alpha = elapsed / fadeIn;
    } else if (elapsed > duration - fadeOut) {
      alpha = Math.max(0, (duration - elapsed) / fadeOut);
    }

    ctx.globalAlpha = alpha;

    // Title text — large, centered
    const titleScale = 2;
    const titleSize = PixelFont.measureText(text, titleScale);
    const tx = Math.floor((INTERNAL_W - titleSize.width) / 2);
    const ty = Math.floor(INTERNAL_H / 2 - titleSize.height - 8);
    PixelFont.drawText(ctx, text, tx, ty, color, titleScale);

    // Subtitle — smaller, below
    if (subtitle) {
      const subScale = 1;
      const subSize = PixelFont.measureText(subtitle, subScale);
      const sx = Math.floor((INTERNAL_W - subSize.width) / 2);
      const sy = ty + titleSize.height + 10;
      PixelFont.drawText(ctx, subtitle, sx, sy, subtitleColor, subScale);
    }

    // Decorative line under title
    const lineW = Math.max(titleSize.width, 80);
    const lineX = Math.floor((INTERNAL_W - lineW) / 2);
    const lineY = ty + titleSize.height + 4;
    ctx.fillStyle = subtitleColor;
    ctx.fillRect(lineX, lineY, lineW, 1);

    ctx.globalAlpha = 1;
  }

  // --- Credits overlay ---

  function drawCreditsOverlay(state) {
    const { lines, color, highlightColor, speed, elapsed } = state;
    const scrollOffset = (elapsed / 1000) * speed;
    const lineHeight = 14;
    const startY = INTERNAL_H - scrollOffset;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const y = Math.floor(startY + i * lineHeight);

      // Skip lines off screen
      if (y < -lineHeight || y > INTERNAL_H) continue;

      // Lines starting with # are headers (highlighted, larger)
      if (line.startsWith('#')) {
        const headerText = line.substring(1).trim();
        const scale = 1;
        const size = PixelFont.measureText(headerText, scale);
        const x = Math.floor((INTERNAL_W - size.width) / 2);
        PixelFont.drawText(ctx, headerText, x, y, highlightColor, scale);
      } else if (line.trim() === '') {
        // Empty line — just spacing
      } else {
        // Normal credit line — centered
        const scale = 1;
        const size = PixelFont.measureText(line, scale);
        const x = Math.floor((INTERNAL_W - size.width) / 2);
        PixelFont.drawText(ctx, line, x, y, color, scale);
      }
    }
  }

  // --- Frame pipeline ---

  function beginFrame() {
    ctx.clearRect(0, 0, INTERNAL_W, INTERNAL_H);
  }

  function applyCamera(camera) {
    ctx.save();
    ctx.translate(Math.round(camera.offsetX), Math.round(camera.offsetY));
  }

  function restoreCamera() {
    ctx.restore();
  }

  function present() {
    displayCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
    displayCtx.drawImage(offscreen, 0, 0, displayCanvas.width, displayCanvas.height);
  }

  function getTextMaxWidth() {
    return INTERNAL_W - DIALOG_MARGIN * 2 - TEXT_PADDING * 2;
  }

  function getTextScale() {
    return TEXT_SCALE;
  }

  function getInternalSize() {
    return { width: INTERNAL_W, height: INTERNAL_H };
  }

  function getBackgroundNames() {
    return Object.keys(backgrounds);
  }

  function renderBackgroundToCanvas(name, targetCanvas) {
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = INTERNAL_W;
    tmpCanvas.height = INTERNAL_H;
    const tmpCtx = tmpCanvas.getContext('2d');
    if (backgrounds[name]) {
      backgrounds[name](tmpCtx);
    }
    const tCtx = targetCanvas.getContext('2d');
    tCtx.imageSmoothingEnabled = false;
    tCtx.drawImage(tmpCanvas, 0, 0, targetCanvas.width, targetCanvas.height);
  }

  return {
    init, beginFrame, applyCamera, restoreCamera, present,
    drawBackground, drawProp, drawCharacter, drawCharacterWithOffset, drawEmoteBubble, drawMusicNotes,
    drawDialogueBox, drawDialogueText, drawFadeOverlay,
    drawTitleOverlay, drawCreditsOverlay,
    getTextMaxWidth, getTextScale, getInternalSize,
    getBackgroundNames, renderBackgroundToCanvas,
  };
})();


/**
 * ScriptParser — Loads, validates, and normalizes cutscene JSON scripts.
 */
const ScriptParser = (() => {
  const VALID_ACTIONS = [
    'transition', 'enter', 'exit', 'dialogue', 'wait',
    'shake', 'emote', 'move', 'setBackground', 'title', 'credits',
    'mill', 'dance', 'stopDance', 'showNotes', 'hideNotes', 'setScale',
    'showProp', 'hideProp',
  ];

  const VALID_DIRECTIONS = ['left', 'right', 'top', 'bottom'];
  const VALID_EFFECTS = ['fadeIn', 'fadeOut', 'cut'];
  const VALID_EMOTES = ['surprise', 'anger', 'happy'];

  function validate(script) {
    const errors = [];

    if (!script.scenes || !Array.isArray(script.scenes) || script.scenes.length === 0) {
      errors.push('Script must have at least one scene.');
    }

    if (!script.characters || typeof script.characters !== 'object') {
      errors.push('Script must define a characters object.');
    }

    if (script.scenes) {
      for (let si = 0; si < script.scenes.length; si++) {
        const scene = script.scenes[si];
        if (!scene.actions || !Array.isArray(scene.actions)) {
          errors.push(`Scene ${si} must have an actions array.`);
          continue;
        }
        for (let ai = 0; ai < scene.actions.length; ai++) {
          const action = scene.actions[ai];
          if (!VALID_ACTIONS.includes(action.type)) {
            errors.push(`Scene ${si}, action ${ai}: unknown type "${action.type}".`);
          }
          if (action.character && !script.characters[action.character]) {
            errors.push(`Scene ${si}, action ${ai}: unknown character "${action.character}".`);
          }
        }
      }
    }

    return errors;
  }

  function normalize(script) {
    // Apply defaults
    const settings = Object.assign({
      resolution: [256, 224],
      textSpeed: 30,
      defaultTransition: 'fade',
    }, script.settings || {});

    const characters = {};
    for (const [id, def] of Object.entries(script.characters || {})) {
      characters[id] = {
        sprite: def.sprite || 'warrior',
        name: def.name || id,
        nameColor: def.nameColor || '#ffffff',
      };
    }

    const scenes = (script.scenes || []).map((scene, i) => ({
      id: scene.id || `scene_${i}`,
      background: scene.background || null,
      actions: scene.actions || [],
    }));

    return {
      title: script.title || 'Untitled Cutscene',
      settings,
      characters,
      scenes,
    };
  }

  async function loadFromUrl(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Failed to load script: ${response.statusText}`);
    const script = await response.json();
    return parse(script);
  }

  function loadFromObject(obj) {
    return parse(obj);
  }

  function parse(script) {
    const errors = validate(script);
    if (errors.length > 0) {
      throw new Error('Script validation errors:\n' + errors.join('\n'));
    }
    return normalize(script);
  }

  return { loadFromUrl, loadFromObject, validate };
})();

          "Leo . . . . . . . . .  Child",
          "Duke Ashford . . . .  Noble",
          "",
          "",
          "#Created with",
          "Pixel Cutscene Renderer",
          "",
          "",
          "#Music and Lyrics",
          "Misophonia",
          "",
          "",
          "",
          "#Thank you for watching",
          "",
          ""
        ], "speed": 20, "color": "#aaaaaa", "highlightColor": "#ffffff" },
        { "type": "transition", "effect": "fadeOut", "duration": 2000 }
      ]
    }
  ]
};

/**
 * CutsceneEngine — Main game loop, action sequencing, input handling.
 */
const CutsceneEngine = (() => {
  let script = null;
  let sceneIndex = 0;
  let actionIndex = 0;
  let running = false;
  let lastTime = 0;
  let animFrame = 0;
  let animTimer = 0;
  const ANIM_INTERVAL = 500; // ms per sprite frame toggle

  // Active characters on screen
  const characters = {};

  // Current state
  let currentBackground = null;
  let waitingForInput = false;
  let waitTimer = 0;
  let currentActionTween = null;
  let activeEmote = null;
  let sceneElapsed = 0; // ms since scene started, for timecodes
  let emoteTimer = 0;

  // Input state
  let advancePressed = false;
  let skipPressed = false;
  let autoAdvance = false; // auto-advance dialogue (for video export)
  let autoAdvanceDelay = 2000; // ms to show completed dialogue before advancing
  let autoAdvanceTimer = 0;
  let onCompleteCallback = null;

  const { getInternalSize } = Renderer;

  function getOffscreenPos(direction) {
    const size = getInternalSize();
    switch (direction) {
      case 'left': return { x: -36, y: null };
      case 'right': return { x: size.width + 4, y: null };
      case 'top': return { x: null, y: -52 };
      case 'bottom': return { x: null, y: size.height + 4 };
      default: return { x: -20, y: null };
    }
  }

  function getOrCreateCharacter(charId) {
    if (!characters[charId]) {
      const def = script.characters[charId];
      characters[charId] = {
        id: charId,
        sprite: def.sprite,
        name: def.name,
        nameColor: def.nameColor,
        x: 0, y: 0,
        baseX: 0, baseY: 0, // home position for milling
        visible: false,
        idleSeed: Math.random() * 1000, // unique per character for varied idle
        milling: false, // wandering around
        dancing: false, // active dancing
      };
    }
    return characters[charId];
  }

  // --- Action processors ---

  function beginAction(action) {
    switch (action.type) {
      case 'transition':
        return beginTransition(action);
      case 'enter':
        return beginEnter(action);
      case 'exit':
        return beginExit(action);
      case 'dialogue':
        return beginDialogue(action);
      case 'wait':
        return beginWait(action);
      case 'shake':
        return beginShake(action);
      case 'emote':
        return beginEmote(action);
      case 'move':
        return beginMove(action);
      case 'setBackground':
        return beginSetBackground(action);
      case 'title':
        return beginTitle(action);
      case 'credits':
        return beginCredits(action);
      case 'mill':
        return beginMill(action);
      case 'dance':
        return beginDance(action);
      case 'stopDance':
        return beginStopDance(action);
      case 'showNotes':
        return beginShowNotes(action);
      case 'hideNotes':
        return beginHideNotes(action);
      case 'setScale':
        return beginSetScale(action);
      case 'showProp':
        return beginShowProp(action);
      case 'hideProp':
        return beginHideProp(action);
      default:
        return { done: true };
    }
  }

  function beginTransition(action) {
    const duration = action.duration || 1000;
    if (action.effect === 'fadeIn') {
      AnimationSystem.startFade(1.0, 0.0, duration);
    } else if (action.effect === 'fadeOut') {
      AnimationSystem.startFade(0.0, 1.0, duration);
    } else if (action.effect === 'cut') {
      return { done: true };
    }
    waitTimer = duration;
    return { done: false, type: 'timed' };
  }

  function beginEnter(action) {
    const char = getOrCreateCharacter(action.character);
    const from = getOffscreenPos(action.from || 'left');
    const to = action.to || { x: 128, y: 120 };
    const duration = action.duration || 800;

    char.x = from.x !== null ? from.x : to.x;
    char.y = from.y !== null ? from.y : to.y;
    char.baseX = to.x;
    char.baseY = to.y;
    char.visible = true;

    const tweenX = AnimationSystem.addTween(char, 'x', char.x, to.x, duration, 'easeOut');
    const tweenY = AnimationSystem.addTween(char, 'y', char.y, to.y, duration, 'easeOut');

    waitTimer = duration;
    return { done: false, type: 'timed' };
  }

  function beginExit(action) {
    const char = getOrCreateCharacter(action.character);
    const toDir = getOffscreenPos(action.to || 'right');
    const duration = action.duration || 800;

    const targetX = toDir.x !== null ? toDir.x : char.x;
    const targetY = toDir.y !== null ? toDir.y : char.y;

    AnimationSystem.addTween(char, 'x', char.x, targetX, duration, 'easeIn');
    AnimationSystem.addTween(char, 'y', char.y, targetY, duration, 'easeIn');

    waitTimer = duration;
    return { done: false, type: 'timed', onDone: () => { char.visible = false; } };
  }

  function beginDialogue(action) {
    const charDef = script.characters[action.character];
    const maxWidth = Renderer.getTextMaxWidth();
    const scale = Renderer.getTextScale();
    const speed = script.settings.textSpeed || 30;

    AnimationSystem.startTypewriter(action.text, speed, maxWidth, scale);
    waitingForInput = true;

    return { done: false, type: 'dialogue', character: action.character };
  }

  function beginWait(action) {
    waitTimer = action.duration || 500;
    return { done: false, type: 'timed' };
  }

  function beginShake(action) {
    AnimationSystem.startShake(action.intensity || 3, action.duration || 500);
    waitTimer = action.duration || 500;
    return { done: false, type: 'timed' };
  }

  function beginEmote(action) {
    const char = getOrCreateCharacter(action.character);
    activeEmote = { character: char, emote: action.emote || 'surprise' };
    emoteTimer = action.duration || 1500;
    waitTimer = emoteTimer;
    return { done: false, type: 'timed', onDone: () => { activeEmote = null; } };
  }

  function beginMove(action) {
    const char = getOrCreateCharacter(action.character);
    const to = action.to || { x: char.x, y: char.y };
    const duration = action.duration || 600;

    AnimationSystem.addTween(char, 'x', char.x, to.x, duration, 'linear');
    AnimationSystem.addTween(char, 'y', char.y, to.y, duration, 'linear');

    waitTimer = duration;
    return { done: false, type: 'timed' };
  }

  function beginSetBackground(action) {
    currentBackground = action.background;
    return { done: true };
  }

  // Title/credits overlay state
  let titleOverlay = null;
  let creditsOverlay = null;

  function beginTitle(action) {
    const duration = action.duration || 4000;
    const fadeIn = action.fadeIn || 800;
    const fadeOut = action.fadeOut || 800;
    titleOverlay = {
      text: action.text || '',
      subtitle: action.subtitle || '',
      color: action.color || '#ffffff',
      subtitleColor: action.subtitleColor || '#8888cc',
      duration: duration,
      fadeIn: fadeIn,
      fadeOut: fadeOut,
      elapsed: 0,
    };
    waitTimer = duration;
    return { done: false, type: 'timed', onDone: () => { titleOverlay = null; } };
  }

  function beginCredits(action) {
    const lines = action.lines || [];
    const speed = action.speed || 30; // pixels per second
    const totalHeight = lines.length * 14 + 224; // enough to scroll everything off
    const duration = (totalHeight / speed) * 1000;
    creditsOverlay = {
      lines: lines,
      color: action.color || '#cccccc',
      highlightColor: action.highlightColor || '#ffffff',
      speed: speed,
      elapsed: 0,
      duration: duration,
    };
    waitTimer = duration;
    return { done: false, type: 'timed', onDone: () => { creditsOverlay = null; } };
  }

  // --- Main loop ---

  // Mill: characters wander near their base position
  function beginMill(action) {
    for (const char of Object.values(characters)) {
      if (char.visible) char.milling = true;
    }
    return { done: true };
  }

  // Dance: characters orbit/move in coordinated patterns
  let danceActive = false;
  let danceElapsed = 0;

  function beginDance(action) {
    danceActive = true;
    danceElapsed = 0;
    for (const char of Object.values(characters)) {
      if (char.visible) char.dancing = true;
    }
    const duration = action.duration || 8000;
    waitTimer = duration;
    return { done: false, type: 'timed', onDone: () => {
      // Dance keeps going until stopDance
    }};
  }

  function beginStopDance(action) {
    danceActive = false;
    for (const char of Object.values(characters)) {
      char.dancing = false;
      char.milling = false;
    }
    return { done: true };
  }

  // Music notes state
  let notesActive = false;
  let notesCharId = null;

  function beginShowNotes(action) {
    notesActive = true;
    notesCharId = action.character || null;
    return { done: true };
  }

  function beginHideNotes(action) {
    notesActive = false;
    notesCharId = null;
    return { done: true };
  }

  // Scale a character
  function beginSetScale(action) {
    const char = getOrCreateCharacter(action.character);
    char.renderScale = action.scale || 1;
    return { done: true };
  }

  // Props on screen
  const activeProps = [];

  function beginShowProp(action) {
    activeProps.push({
      name: action.prop || 'amplifier',
      x: action.x || 0,
      y: action.y || 0,
    });
    return { done: true };
  }

  function beginHideProp(action) {
    const idx = activeProps.findIndex(p => p.name === (action.prop || 'amplifier'));
    if (idx >= 0) activeProps.splice(idx, 1);
    return { done: true };
  }

  // Idle/dance animation update — called every frame
  function updateCharacterAnimations(dt) {
    const t = Date.now();
    if (danceActive) danceElapsed += dt;

    const visibleChars = Object.values(characters).filter(c => c.visible);

    for (let i = 0; i < visibleChars.length; i++) {
      const char = visibleChars[i];
      const seed = char.idleSeed;

      if (char.dancing) {
        // Coordinated dance: characters orbit in a circle pattern
        const totalChars = visibleChars.length;
        const angle = (t / 3000 + (i / totalChars) * Math.PI * 2) % (Math.PI * 2);
        const centerX = 112;
        const centerY = 100;
        const radiusX = 60 + Math.sin(t / 2000) * 15;
        const radiusY = 25 + Math.sin(t / 2500) * 8;
        char.x = centerX + Math.cos(angle) * radiusX;
        char.y = centerY + Math.sin(angle) * radiusY;
      } else if (char.milling) {
        // Energetic wandering near base position with bounce
        const wx = Math.sin(t / 1500 + seed) * 12 + Math.sin(t / 2500 + seed * 2) * 6;
        const wy = Math.sin(t / 1800 + seed * 1.5) * 5 + Math.abs(Math.sin(t / 400 + seed * 3)) * -2;
        char.x = char.baseX + wx;
        char.y = char.baseY + wy;
      } else {
        // Subtle idle bob — slight vertical bounce
        // Don't override if a tween is actively moving the character
      }
    }
  }

  let currentActionState = null;

  function processNextAction() {
    const scene = script.scenes[sceneIndex];
    if (!scene) {
      running = false;
      if (onCompleteCallback) { onCompleteCallback(); onCompleteCallback = null; }
      return;
    }

    if (actionIndex >= scene.actions.length) {
      // Move to next scene
      sceneIndex++;
      actionIndex = 0;
      sceneElapsed = 0;
      if (sceneIndex < script.scenes.length) {
        const nextScene = script.scenes[sceneIndex];
        if (nextScene.background) {
          currentBackground = nextScene.background;
        }
      }
      processNextAction();
      return;
    }

    const action = scene.actions[actionIndex];

    // Timecode support: if action has "at" field, wait until scene time reaches it
    if (action.at !== undefined && sceneElapsed < action.at) {
      waitTimer = action.at - sceneElapsed;
      currentActionState = { done: false, type: 'timed', onDone: () => {
        currentActionState = beginAction(action);
        if (currentActionState.done) { actionIndex++; processNextAction(); }
      }};
      return;
    }

    currentActionState = beginAction(action);

    if (currentActionState.done) {
      actionIndex++;
      processNextAction();
    }
  }

  function update(dt) {
    if (!running || !currentActionState) return;

    sceneElapsed += dt;
    AnimationSystem.update(dt);

    // Sprite animation
    animTimer += dt;
    if (animTimer >= ANIM_INTERVAL) {
      animTimer -= ANIM_INTERVAL;
      animFrame = (animFrame + 1) % 2;
    }

    // Emote bob
    if (activeEmote) {
      emoteTimer -= dt;
      if (emoteTimer <= 0) {
        activeEmote = null;
      }
    }

    // Character animations (idle/mill/dance)
    updateCharacterAnimations(dt);

    // Update overlay timers
    if (titleOverlay) titleOverlay.elapsed += dt;
    if (creditsOverlay) creditsOverlay.elapsed += dt;

    if (currentActionState.type === 'timed') {
      waitTimer -= dt;
      if (waitTimer <= 0 || skipPressed) {
        if (currentActionState.onDone) currentActionState.onDone();
        skipPressed = false;
        actionIndex++;
        processNextAction();
      }
    } else if (currentActionState.type === 'dialogue') {
      const twState = AnimationSystem.getTypewriterState();
      if (autoAdvance) {
        if (twState.done) {
          autoAdvanceTimer += dt;
          if (autoAdvanceTimer >= autoAdvanceDelay) {
            waitingForInput = false;
            autoAdvanceTimer = 0;
            actionIndex++;
            processNextAction();
          }
        }
      } else if (advancePressed) {
        if (!twState.done) {
          AnimationSystem.completeTypewriter();
        } else {
          waitingForInput = false;
          advancePressed = false;
          actionIndex++;
          processNextAction();
        }
        advancePressed = false;
      }
    }
  }

  function render() {
    Renderer.beginFrame();

    // Background
    if (currentBackground) {
      Renderer.drawBackground(currentBackground);
    }

    // Camera (shake)
    const camera = AnimationSystem.getCamera();
    Renderer.applyCamera(camera);

    // Props (behind characters)
    for (const prop of activeProps) {
      Renderer.drawProp(prop.name, Math.round(prop.x), Math.round(prop.y));
    }

    // Characters — with idle bob
    const t = Date.now();
    for (const char of Object.values(characters)) {
      const idleBob = (!char.dancing && !char.milling) ? Math.sin(t / 600 + char.idleSeed * 10) * 1.5 : 0;
      Renderer.drawCharacterWithOffset(char, animFrame, 0, idleBob);
    }

    // Music notes
    if (notesActive && notesCharId && characters[notesCharId]) {
      const nc = characters[notesCharId];
      if (nc.visible) {
        const scale = nc.renderScale || 1;
        Renderer.drawMusicNotes(
          nc.x + (SpriteLibrary.W * scale) / 2,
          nc.y,
          Date.now()
        );
      }
    }

    // Emote
    if (activeEmote) {
      const bob = Math.sin(Date.now() / 200) * 2;
      Renderer.drawEmoteBubble(activeEmote.character, activeEmote.emote, bob);
    }

    Renderer.restoreCamera();

    // Dialogue box
    if (waitingForInput) {
      const charId = script.scenes[sceneIndex]?.actions[actionIndex]?.character;
      const charDef = charId ? script.characters[charId] : null;
      Renderer.drawDialogueBox(
        charDef ? charDef.name : '',
        charDef ? charDef.nameColor : '#ffffff'
      );
      Renderer.drawDialogueText(AnimationSystem.getTypewriterState());
    }

    // Title overlay
    if (titleOverlay) {
      Renderer.drawTitleOverlay(titleOverlay);
    }

    // Credits overlay
    if (creditsOverlay) {
      Renderer.drawCreditsOverlay(creditsOverlay);
    }

    // Fade overlay
    const fadeAlpha = AnimationSystem.getFadeAlpha();
    Renderer.drawFadeOverlay(fadeAlpha);

    // Present to display canvas
    Renderer.present();
  }

  function gameLoop(timestamp) {
    if (!running) return;
    const dt = lastTime ? timestamp - lastTime : 16;
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }

  // --- Public API ---

  function play(cutsceneScript, options) {
    script = cutsceneScript;
    sceneIndex = 0;
    actionIndex = 0;
    running = true;
    lastTime = 0;
    animFrame = 0;
    animTimer = 0;
    waitingForInput = false;
    waitTimer = 0;
    activeEmote = null;
    titleOverlay = null;
    creditsOverlay = null;
    sceneElapsed = 0;
    danceActive = false;
    notesActive = false;
    notesCharId = null;
    activeProps.length = 0;
    currentActionState = null;
    autoAdvance = (options && options.autoAdvance) || false;
    autoAdvanceDelay = (options && options.autoAdvanceDelay) || 2000;
    autoAdvanceTimer = 0;
    onCompleteCallback = (options && options.onComplete) || null;

    // Clear characters
    for (const key of Object.keys(characters)) {
      delete characters[key];
    }

    AnimationSystem.clear();

    // Set initial background from first scene
    if (script.scenes[0] && script.scenes[0].background) {
      currentBackground = script.scenes[0].background;
    } else {
      currentBackground = null;
    }

    // Start processing
    processNextAction();
    requestAnimationFrame(gameLoop);
  }

  function stop() {
    running = false;
  }

  function pause() {
    running = false;
  }

  function resume() {
    if (!script || !currentActionState) return;
    running = true;
    lastTime = 0;
    requestAnimationFrame(gameLoop);
  }

  function step() {
    if (!script) return;
    running = false;
    // Advance one action — skip instant actions until we hit a timed/dialogue one
    if (currentActionState) {
      if (currentActionState.onDone) currentActionState.onDone();
      if (currentActionState.type === 'dialogue') waitingForInput = false;
      actionIndex++;
    }
    // Process next actions, stopping at the first non-instant one
    const scene = script.scenes[sceneIndex];
    if (!scene) return;
    while (actionIndex < scene.actions.length || sceneIndex < script.scenes.length - 1) {
      processNextAction();
      if (!currentActionState || !currentActionState.done) break;
    }
    // Render one frame
    AnimationSystem.update(16);
    render();
  }

  function jumpToScene(index) {
    if (!script || index < 0 || index >= script.scenes.length) return;
    // Reset state
    for (const key of Object.keys(characters)) delete characters[key];
    AnimationSystem.clear();
    waitingForInput = false;
    waitTimer = 0;
    activeEmote = null;
    titleOverlay = null;
    creditsOverlay = null;
    sceneElapsed = 0;
    danceActive = false;
    notesActive = false;
    notesCharId = null;
    activeProps.length = 0;
    currentActionState = null;
    sceneIndex = index;
    actionIndex = 0;
    const scene = script.scenes[sceneIndex];
    if (scene && scene.background) currentBackground = scene.background;
    running = true;
    lastTime = 0;
    processNextAction();
    requestAnimationFrame(gameLoop);
  }

  function nextScene() {
    if (!script) return;
    jumpToScene(sceneIndex + 1);
  }

  function prevScene() {
    if (!script) return;
    jumpToScene(Math.max(0, sceneIndex - 1));
  }

  function getSceneCount() {
    return script ? script.scenes.length : 0;
  }

  function getState() {
    return {
      sceneIndex,
      actionIndex,
      running,
      waitingForInput,
      currentBackground,
      characterCount: Object.keys(characters).length,
      sceneCount: script ? script.scenes.length : 0,
    };
  }

  function handleInput(type) {
    if (type === 'advance') {
      advancePressed = true;
    } else if (type === 'skip') {
      skipPressed = true;
    }
  }

  function isRunning() { return running; }
  return { play, stop, pause, resume, step, getState, handleInput, isRunning, nextScene, prevScene, jumpToScene, getSceneCount };
})();


// --- Self-contained page initialization ---
(function initPage() {
  const canvas = document.getElementById('display-canvas');
  Renderer.init(canvas);
  canvas.addEventListener('click', () => CutsceneEngine.handleInput('advance'));
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); CutsceneEngine.handleInput('advance'); });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); CutsceneEngine.handleInput('advance'); }
    else if (e.code === 'Escape') CutsceneEngine.handleInput('skip');
  });
  document.getElementById('btn-load').addEventListener('click', function() {
    document.getElementById('script-file').click();
  });
  document.getElementById('script-file').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var text = reader.result;
        if (typeof text !== 'string') { alert('Error: could not read file as text'); return; }
        text = text.trim();
        var raw = JSON.parse(text);
        var parsed = ScriptParser.loadFromObject(raw);
        window._lastScript = parsed;
        CutsceneEngine.stop();
        CutsceneEngine.play(parsed);
      } catch (err) { alert('Error: ' + err.message + '\nFirst 100 chars: ' + String(reader.result).substring(0, 100)); }
    };
    reader.readAsText(file, 'UTF-8');
  });
  document.getElementById('btn-demo').addEventListener('click', () => playScript(DEMO_SCRIPT));
  document.getElementById('btn-serenade').addEventListener('click', () => playScript(SERENADE_SCRIPT));
  document.getElementById('btn-shards').addEventListener('click', () => playScript(SHARDS_SCRIPT));
  document.getElementById('btn-restart').addEventListener('click', () => { if (window._lastScript) { CutsceneEngine.stop(); CutsceneEngine.play(window._lastScript); } });

  // --- Scene navigation ---
  document.getElementById('btn-prev').addEventListener('click', () => CutsceneEngine.prevScene());
  document.getElementById('btn-next').addEventListener('click', () => CutsceneEngine.nextScene());

  // --- Video Recording ---
  var mediaRecorder = null;
  var recordedChunks = [];
  var recordBtn = document.getElementById('btn-record');
  var exportBtn = document.getElementById('btn-export-vid');
  var statusEl = document.getElementById('record-status');

  recordBtn.addEventListener('click', function() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }
    startRecording();
  });

  exportBtn.addEventListener('click', function() {
    if (!window._lastScript) { alert('Load a script first'); return; }
    startRecording();
    CutsceneEngine.stop();
    CutsceneEngine.play(window._lastScript, {
      autoAdvance: true,
      autoAdvanceDelay: 2000,
      onComplete: function() {
        setTimeout(function() {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
          }
        }, 500);
      }
    });
  });

  function startRecording() {
    var canvas = document.getElementById('display-canvas');
    var stream = canvas.captureStream(30);
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    mediaRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = function() {
      var blob = new Blob(recordedChunks, { type: 'video/webm' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'cutscene.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      recordBtn.textContent = 'Record';
      recordBtn.style.background = '#553333';
      statusEl.style.display = 'none';
    };
    mediaRecorder.onerror = function(e) {
      alert('Recording error: ' + e.error);
      recordBtn.textContent = 'Record';
      statusEl.style.display = 'none';
    };
    mediaRecorder.start();
    recordBtn.textContent = 'Stop';
    recordBtn.style.background = '#cc3333';
    statusEl.style.display = 'block';
  }

  playScript(DEMO_SCRIPT);
  function playScript(data) {
    var parsed = ScriptParser.loadFromObject(data);
    window._lastScript = parsed;
    CutsceneEngine.stop();
    CutsceneEngine.play(parsed);
  }
})();
</script>
